<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RehabRangers</title>
<!--
  ============================================================
  REHABRANGERS  —  single-file app (HTML + CSS + JS)
  ============================================================
  A wildlife rehabilitation center management system:
  register rescues, log daily care, track recovery, record
  releases, and report outcomes — all stored locally.

  HOW TO USE
  1. Save this file as index.html and open it in any modern browser.
  2. On first run the app seeds a demo center, 10 animals,
     care logs and release records so nothing is empty.
  3. Demo logins:
        Admin      admin@demo.com     / Admin123
        Vet        vet@demo.com       / Vet12345
        Volunteer  volunteer@demo.com / Vol12345
  4. All data is stored in localStorage under the keys:
     users, company, animals, careLogs, releases, session, preferences.
     Use Settings > Data / Backup to export or import a JSON backup.
  5. Passwords are hashed with SHA-256 (Web Crypto API).
     They are never stored in plain text.
  ============================================================
-->
<style>
/* ---------- Theme variables ---------- */
:root{
  --brand:#2e8b57;
  --brand-600:#227144;
  --brand-100:#e6f3ec;
  --earth:#b07d4a;
  --earth-100:#f6efe6;
  --bg:#f3f7f4;
  --bg-alt:#eaf1ec;
  --card:#ffffff;
  --text:#1c2a22;
  --muted:#6b7f72;
  --line:#e2eae4;
  --shadow:0 4px 16px rgba(28,60,42,.06);
  --shadow-lg:0 16px 48px rgba(10,25,16,.22);
  --radius:13px;
  --danger:#c0392b;
  --warn:#c07f10;
  --info:#2a6fb0;
}
[data-theme="dark"]{
  --brand:#45b57c;
  --brand-600:#2e8b57;
  --brand-100:#193024;
  --earth:#c9975f;
  --earth-100:#2a241c;
  --bg:#0e1712;
  --bg-alt:#131f18;
  --card:#152119;
  --text:#e6efe8;
  --muted:#93a89a;
  --line:#233429;
  --shadow:0 4px 16px rgba(0,0,0,.32);
  --shadow-lg:0 16px 48px rgba(0,0,0,.5);
  --danger:#e0685a;
  --warn:#e0a94b;
  --info:#5a9fd8;
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease,color .25s ease;
  font-size:14px;
}
h1,h2,h3,h4{margin:0;line-height:1.22;letter-spacing:-.01em}
h1{font-size:1.15rem}
h2{font-size:.98rem}
h3{font-size:.9rem}
p{margin:0}
a{color:var(--brand-600);text-decoration:none}
.muted{color:var(--muted);font-size:.8rem}
.ic{flex:0 0 auto;display:block}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 13px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);color:var(--text);font:inherit;font-size:.82rem;
  font-weight:600;cursor:pointer;transition:transform .12s ease,background .15s ease,box-shadow .15s ease;
  white-space:nowrap;
}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:none}
.btn-primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-600)}
.btn-ghost{background:transparent}
.btn-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn-sm{padding:5px 9px;font-size:.74rem;border-radius:8px}
.btn-block{width:100%}
.icon-btn{
  width:31px;height:31px;display:inline-grid;place-items:center;border-radius:9px;
  border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;
  transition:background .15s ease,transform .12s ease;
}
.icon-btn:hover{background:var(--brand-100);transform:translateY(-1px)}
.icon-btn.danger:hover{background:rgba(192,57,43,.12);color:var(--danger)}
.link-btn{background:none;border:none;color:var(--brand-600);font:inherit;font-weight:600;cursor:pointer;padding:0;text-decoration:underline}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;min-width:0}
.field label,.lbl{font-size:.68rem;font-weight:700;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
input,select,textarea{
  width:100%;padding:8px 11px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit;font-size:.85rem;outline:none;
  transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-100);background:var(--card)}
input[readonly]{opacity:.75;cursor:not-allowed}
textarea{min-height:60px;resize:vertical}
input.invalid,select.invalid,textarea.invalid{border-color:var(--danger);box-shadow:0 0 0 3px rgba(192,57,43,.12)}
.check{display:flex;align-items:center;gap:8px;font-size:.83rem;font-weight:500;color:var(--text)}
.check input{width:15px;height:15px;accent-color:var(--brand);flex:0 0 auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.row,.row-3{grid-template-columns:1fr}}
.pass-wrap{position:relative}
.pass-wrap input{padding-right:38px}
.pass-toggle{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:6px;display:grid;place-items:center;border-radius:8px}
.pass-toggle:hover{background:var(--brand-100);color:var(--brand-600)}

/* ---------- Auth ---------- */
.auth-wrap{
  min-height:100vh;display:grid;place-items:center;padding:18px;
  background:radial-gradient(1000px 500px at 8% 0%,var(--brand-100),transparent 62%),var(--bg);
}
.auth-card{
  display:grid;grid-template-columns:1fr 1.12fr;width:100%;max-width:880px;
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  box-shadow:var(--shadow);overflow:hidden;
}
.auth-side{
  background:linear-gradient(160deg,var(--brand) 0%,#17492f 100%);
  color:#fff;padding:30px 26px;display:flex;flex-direction:column;justify-content:space-between;gap:22px;
}
.auth-side .logo-row{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem;letter-spacing:.02em}
.auth-side .logo-row img{width:36px;height:36px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.auth-side h2{font-size:1.38rem;line-height:1.2;margin-bottom:9px}
.auth-side p{opacity:.85;font-size:.86rem;line-height:1.5}
.auth-feats{display:flex;flex-direction:column;gap:9px;margin-top:16px}
.auth-feat{display:flex;align-items:center;gap:9px;font-size:.82rem;opacity:.95}
.auth-feat .dot{width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:0 0 auto}
.auth-main{padding:28px 28px}
.auth-main h1{font-size:1.25rem;margin-bottom:3px}
.auth-main .sub{color:var(--muted);font-size:.83rem;margin-bottom:16px}
.auth-err{background:rgba(192,57,43,.1);color:var(--danger);border:1px solid rgba(192,57,43,.25);padding:8px 11px;border-radius:9px;font-size:.8rem;margin-bottom:11px;display:none}
.auth-err.show{display:block}
.strength{height:5px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.strength span{display:block;height:100%;width:0;background:var(--danger);transition:width .25s ease,background .25s ease}
.strength-txt{font-size:.7rem;color:var(--muted);margin-top:4px}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:9px}
.seg label{
  display:flex;align-items:center;gap:7px;padding:7px 11px;border-radius:9px;
  border:1px solid var(--line);cursor:pointer;font-size:.8rem;font-weight:600;color:var(--muted);
  text-transform:none;letter-spacing:0;
}
.seg input{width:14px;height:14px;accent-color:var(--brand);margin:0}
.seg label:has(input:checked){border-color:var(--brand);background:var(--brand-100);color:var(--brand-600)}
@media(max-width:860px){
  .auth-card{grid-template-columns:1fr;max-width:480px}
  .auth-side{display:none}
  .auth-main{padding:24px 20px}
}

/* ---------- App shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{
  width:220px;flex:0 0 220px;background:var(--card);border-right:1px solid var(--line);
  padding:14px 10px;display:flex;flex-direction:column;gap:14px;
  position:sticky;top:0;height:100vh;z-index:800;
}
.brand{display:flex;align-items:center;gap:9px;padding:2px 6px 0;min-width:0}
.brand-logo{width:34px;height:34px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.brand-fallback{display:grid;place-items:center;background:var(--brand);color:#fff}
.brand-txt{min-width:0}
.brand-txt strong{display:block;font-size:.84rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt small{color:var(--muted);font-size:.64rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow:auto}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
  color:var(--muted);font-weight:600;font-size:.83rem;transition:background .15s ease,color .15s ease;
}
.nav a:hover{background:var(--brand-100);color:var(--brand-600)}
.nav a.active{background:var(--brand);color:#fff;box-shadow:0 6px 14px rgba(46,139,87,.26)}
.sidebar-foot{border-top:1px solid var(--line);padding-top:10px;font-size:.7rem;color:var(--muted);line-height:1.45}
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  display:flex;align-items:center;gap:10px;padding:9px 16px;
  background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:700;
}
.topbar h1{font-size:1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.menu-btn{display:none}
.topbar-right{display:flex;align-items:center;gap:8px}
.user-menu{position:relative}
.user-chip{
  display:flex;align-items:center;gap:8px;padding:5px 8px 5px 5px;border-radius:11px;
  border:1px solid var(--line);background:var(--card);cursor:pointer;font:inherit;color:var(--text);
}
.user-chip:hover{background:var(--brand-100)}
.avatar{
  width:27px;height:27px;border-radius:8px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:800;font-size:.7rem;flex:0 0 auto;
}
.user-meta{display:flex;flex-direction:column;align-items:flex-start;line-height:1.12;min-width:0}
.user-meta strong{font-size:.76rem;white-space:nowrap;max-width:120px;overflow:hidden;text-overflow:ellipsis}
.user-meta small{font-size:.64rem;color:var(--muted)}
.dropdown{
  position:absolute;right:0;top:calc(100% + 6px);min-width:180px;background:var(--card);
  border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:5px;
  display:flex;flex-direction:column;gap:2px;z-index:900;
}
.dropdown[hidden]{display:none}
.dropdown a,.dropdown button{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;
  color:var(--text);font:inherit;font-size:.82rem;font-weight:600;background:none;border:none;
  cursor:pointer;text-align:left;width:100%;
}
.dropdown a:hover,.dropdown button:hover{background:var(--brand-100);color:var(--brand-600)}
.content{padding:14px 16px;max-width:1180px;width:100%;margin:0 auto;flex:1}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-104%);transition:transform .25s ease;box-shadow:var(--shadow-lg);height:100vh}
  .sidebar.open{transform:none}
  .menu-btn{display:inline-grid}
  .content{padding:12px}
  .topbar{padding:9px 12px}
  .user-meta{display:none}
}

/* ---------- Cards / layout ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px}
.card + .card{margin-top:12px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.card-head h2,.card-head h3{display:flex;align-items:center;gap:7px}
.stack{display:flex;flex-direction:column;gap:12px}
.grid-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}
@media(max-width:1000px){.grid-stats{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.grid-stats{grid-template-columns:1fr}}
.stat{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:3px;position:relative;overflow:hidden;
}
.stat::after{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--brand)}
.stat.earth::after{background:var(--earth)}
.stat.info::after{background:var(--info)}
.stat.warn::after{background:var(--warn)}
.stat .lbl{display:flex;align-items:center;gap:6px;font-size:.66rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em}
.stat .val{font-size:1.42rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat .hint{font-size:.69rem;color:var(--muted)}
.two-col{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}
@media(max-width:900px){.two-col{grid-template-columns:1fr}}

/* ---------- Badges ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:.67rem;font-weight:700;white-space:nowrap}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.badge[data-status="Admitted"]{background:#e6f0fb;color:#1f6fb2}
.badge[data-status="Under Treatment"]{background:#fdf0d9;color:#a86a08}
.badge[data-status="Recovering"]{background:#efe8fb;color:#6a44b8}
.badge[data-status="Ready for Release"]{background:#e2f5e9;color:#1f7a4c}
.badge[data-status="Released"]{background:#d9f2e3;color:#12693f}
.badge[data-status="Transferred"]{background:#f7ecdd;color:#9a6a2f}
.badge[data-status="Deceased"]{background:#fbe7e5;color:#a4342a}
[data-theme="dark"] .badge[data-status="Admitted"]{background:rgba(64,150,220,.18);color:#7dbcf0}
[data-theme="dark"] .badge[data-status="Under Treatment"]{background:rgba(224,169,75,.18);color:#e6bb6b}
[data-theme="dark"] .badge[data-status="Recovering"]{background:rgba(150,110,220,.18);color:#b79bf0}
[data-theme="dark"] .badge[data-status="Ready for Release"]{background:rgba(69,181,124,.18);color:#6fd3a0}
[data-theme="dark"] .badge[data-status="Released"]{background:rgba(69,181,124,.24);color:#7ddcae}
[data-theme="dark"] .badge[data-status="Transferred"]{background:rgba(201,151,95,.18);color:#dbb083}
[data-theme="dark"] .badge[data-status="Deceased"]{background:rgba(224,104,90,.18);color:#f0948a}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--bg-alt);color:var(--muted);font-size:.68rem;font-weight:700}
.pill.warn{background:rgba(192,127,16,.14);color:var(--warn)}
.pill.danger{background:rgba(192,57,43,.14);color:var(--danger)}
.pill.ok{background:rgba(46,139,87,.14);color:var(--brand-600)}

/* ---------- Tables ---------- */
.table-wrap{overflow:auto;border-radius:11px;border:1px solid var(--line);background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:.81rem;min-width:560px}
th{
  text-align:left;padding:8px 10px;background:var(--bg-alt);color:var(--muted);
  font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;font-weight:800;white-space:nowrap;
}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:hover{background:var(--brand-100)}
.td-actions{display:flex;gap:4px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.77rem;font-weight:700}

/* ---------- Bars / chart ---------- */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:150px;padding-top:6px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.bar-track{width:100%;max-width:40px;flex:1;display:flex;align-items:flex-end;background:var(--bg-alt);border-radius:8px;overflow:hidden}
.bar-fill{width:100%;background:linear-gradient(180deg,var(--brand),var(--brand-600));border-radius:8px;min-height:4px;transition:height .45s ease}
.bar-count{font-size:.72rem;font-weight:800;margin-top:5px}
.bar-label{font-size:.56rem;color:var(--muted);text-align:center;line-height:1.12;margin-top:1px;word-break:break-word;hyphens:auto}
.hbar{display:flex;flex-direction:column;gap:9px}
.hbar-row{display:grid;grid-template-columns:96px 1fr 32px;align-items:center;gap:9px;font-size:.8rem}
.hbar-track{height:10px;border-radius:99px;background:var(--bg-alt);overflow:hidden}
.hbar-fill{height:100%;border-radius:99px;background:var(--brand);transition:width .4s ease}
.hbar-fill.earth{background:var(--earth)}
.hbar-fill.danger{background:var(--danger)}

/* ---------- Progress steps ---------- */
.steps{display:flex;gap:4px;margin:4px 0 0}
.step{flex:1;text-align:center;font-size:.58rem;color:var(--muted);line-height:1.15}
.step .bar{height:6px;border-radius:99px;background:var(--bg-alt);margin-bottom:5px;transition:background .3s ease}
.step.done .bar{background:var(--brand)}
.step.current .bar{background:var(--brand);box-shadow:0 0 0 3px var(--brand-100)}
.step.current{color:var(--brand-600);font-weight:800}

/* ---------- Lists ---------- */
.list{display:flex;flex-direction:column;gap:1px}
.list-item{display:flex;align-items:center;gap:9px;padding:7px 6px;border-radius:9px;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:none}
.list-item:hover{background:var(--brand-100)}
.list-item .grow{flex:1;min-width:0}
.list-item .grow strong{display:block;font-size:.83rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item .grow small{color:var(--muted);font-size:.71rem}
.thumb{width:32px;height:32px;border-radius:9px;object-fit:cover;background:var(--bg-alt);display:grid;place-items:center;color:var(--muted);flex:0 0 auto}

/* ---------- Empty state ---------- */
.empty{text-align:center;padding:26px 14px;color:var(--muted)}
.empty .em-ic{width:48px;height:48px;border-radius:15px;background:var(--brand-100);color:var(--brand-600);display:grid;place-items:center;margin:0 auto 10px}
.empty h3{color:var(--text);margin-bottom:5px;font-size:.92rem}
.empty p{font-size:.81rem;margin-bottom:12px}

/* ---------- Toolbar ---------- */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:11px}
.toolbar .grow{flex:1;min-width:170px}
.search-wrap{position:relative;flex:1;min-width:180px}
.search-wrap .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-wrap input{padding-left:33px}
.toolbar select{width:auto;min-width:118px}
@media(max-width:600px){
  .toolbar select,.toolbar .btn{flex:1 1 auto}
  .search-wrap{flex:1 1 100%}
}

/* ---------- Pagination ---------- */
.pager{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.pager .pages{display:flex;gap:4px;flex-wrap:wrap}
.page-btn{
  min-width:29px;height:29px;border-radius:8px;border:1px solid var(--line);background:var(--card);
  color:var(--text);font:inherit;font-size:.77rem;font-weight:700;cursor:pointer;
}
.page-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}
.page-btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Settings ---------- */
.settings-grid{display:grid;grid-template-columns:196px 1fr;gap:12px;align-items:start}
@media(max-width:820px){.settings-grid{grid-template-columns:1fr}}
.submenu{display:flex;flex-direction:column;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;box-shadow:var(--shadow)}
.submenu button{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:none;
  background:none;color:var(--muted);font:inherit;font-size:.81rem;font-weight:600;cursor:pointer;text-align:left;
}
.submenu button:hover{background:var(--brand-100);color:var(--brand-600)}
.submenu button.active{background:var(--brand);color:#fff}
@media(max-width:820px){
  .submenu{flex-direction:row;overflow:auto;padding:5px}
  .submenu button{white-space:nowrap}
}
.form-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.logo-preview{width:60px;height:60px;border-radius:13px;object-fit:cover;background:var(--bg-alt);display:grid;place-items:center;color:var(--muted);border:1px dashed var(--line)}
.photo-drop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.photo-drop .preview{width:84px;height:84px;border-radius:13px;object-fit:cover;background:var(--bg-alt);display:grid;place-items:center;color:var(--muted);border:1px dashed var(--line);overflow:hidden}
.photo-drop .preview img{width:100%;height:100%;object-fit:cover}

/* ---------- Profile header ---------- */
.profile-head{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.profile-photo{width:104px;height:104px;border-radius:15px;object-fit:cover;background:var(--bg-alt);display:grid;place-items:center;color:var(--muted);flex:0 0 auto;overflow:hidden}
.profile-photo img{width:100%;height:100%;object-fit:cover}
.profile-meta{flex:1;min-width:220px;display:flex;flex-direction:column;gap:9px}
.profile-title{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:8px}
.kv div span{display:block;font-size:.61rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin-bottom:2px}
.kv div strong{font-size:.81rem;font-weight:600;word-break:break-word}

/* ---------- Toast ---------- */
#toast-wrap{position:fixed;bottom:16px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:9999;max-width:calc(100vw - 32px)}
.toast{
  background:var(--card);border:1px solid var(--line);border-left:4px solid var(--brand);
  padding:9px 13px;border-radius:10px;box-shadow:var(--shadow-lg);font-size:.82rem;font-weight:600;
  min-width:190px;animation:toastIn .25s ease;display:flex;align-items:center;gap:8px;
}
.toast.error{border-left-color:var(--danger)}
.toast.warn{border-left-color:var(--warn)}
@keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- Modal ---------- */
.modal-backdrop{position:fixed;inset:0;background:rgba(8,18,12,.5);display:grid;place-items:center;z-index:9000;padding:16px;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border-radius:16px;max-width:540px;width:100%;padding:16px;
  max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg);border:1px solid var(--line);
}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap}

/* ---------- Print ---------- */
#print-area{display:none}
@media print{
  .sidebar,.topbar,.no-print,.btn,.icon-btn,.pager,.toolbar,#toast-wrap,#modal-root{display:none!important}
  body{background:#fff;color:#000}
  body.printing #app{display:none!important}
  body.printing #print-area{display:block!important}
  .content{padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ddd}
  .print-doc{font-family:Georgia,"Times New Roman",serif;color:#111;padding:10px}
  .print-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #2e8b57;padding-bottom:12px;margin-bottom:16px}
  .print-head img{width:56px;height:56px;object-fit:contain;border-radius:9px}
  .print-head h2{margin:0;font-size:19px}
  .print-head .sub{font-size:11px;color:#555}
  .print-doc h3{margin:14px 0 9px;font-size:15px}
  .print-doc table{width:100%;border-collapse:collapse;font-size:11px;margin-top:7px}
  .print-doc th,.print-doc td{border:1px solid #ccc;padding:5px 7px;text-align:left}
  .print-doc th{background:#f2f6f2}
  .print-foot{margin-top:18px;font-size:10px;color:#666;border-top:1px solid #ddd;padding-top:9px}
}

/* ---------- Misc ---------- */
.hidden{display:none!important}
.text-right{text-align:right}
.nowrap{white-space:nowrap}
.alert{
  display:flex;gap:8px;align-items:flex-start;padding:9px 11px;border-radius:10px;
  font-size:.81rem;font-weight:600;border:1px solid transparent;margin-bottom:12px;
}
.alert.warn{background:rgba(192,127,16,.1);border-color:rgba(192,127,16,.3);color:var(--warn)}
.alert.ok{background:rgba(46,139,87,.1);border-color:rgba(46,139,87,.3);color:var(--brand-600)}
.alert.info{background:rgba(42,111,176,.1);border-color:rgba(42,111,176,.3);color:var(--info)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
</style>

/* =========================================================
   3. STORAGE HELPERS
   ========================================================= */
function read(key, fallback){
  try{
    const raw = localStorage.getItem(key);
    if(raw === null || raw === undefined) return fallback;
    const val = JSON.parse(raw);
    return val === null ? fallback : val;
  }catch(e){ return fallback; }
}
function write(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ showToast('Storage full — try removing photos or exporting a backup.','error'); }
}
function getAll(key){
  const v = read(key, []);
  return Array.isArray(v) ? v : [];
}
function saveAll(key, arr){ write(key, arr); }

function company(){
  const c = read(K.COMPANY, null);
  return Object.assign({}, DEFAULT_COMPANY, c || {});
}
function saveCompany(patch){
  const c = Object.assign(company(), patch);
  write(K.COMPANY, c);
  return c;
}
function prefs(){
  const p = read(K.PREFS, null);
  return Object.assign({}, DEFAULT_PREFS, p || {});
}
function savePrefs(patch){
  const p = Object.assign(prefs(), patch);

function esc(s){
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function generateId(prefix){
  return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function todayISO(){
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function formatDate(iso){
  if(!iso) return '—';
  const raw = String(iso);
  const d = new Date(raw.length === 10 ? raw + 'T00:00:00' : raw);
  if(isNaN(d.getTime())) return '—';
  const fmt = prefs().dateFormat || 'MMM D, YYYY';
  const M = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  if(fmt === 'DD/MM/YYYY') return dd + '/' + mm + '/' + yyyy;
  if(fmt === 'MM/DD/YYYY') return mm + '/' + dd + '/' + yyyy;
  if(fmt === 'YYYY-MM-DD') return yyyy + '-' + mm + '-' + dd;
  return M[d.getMonth()] + ' ' + d.getDate() + ', ' + yyyy;
}
function isSameMonth(iso, ref){
  if(!iso) return false;
  const d = new Date(String(iso).slice(0,10) + 'T00:00:00');
  if(isNaN(d.getTime())) return false;
  return d.getMonth() === ref.getMonth() && d.getFullYear() === ref.getFullYear();
}
function fmtWeight(grams){
  const g = Number(grams);
  if(!isFinite(g) || g <= 0) return '—';
  const unit = prefs().weightUnit || 'g';
  if(unit === 'kg') return (g/1000).toFixed(2) + ' kg';
  if(unit === 'lb') return (g/453.59237).toFixed(2) + ' lb';
  return Math.round(g) + ' g';
}
function initials(name){
  return String(name || '?').trim().split(/\s+/).slice(0,2).map(function(w){ return w.charAt(0).toUpperCase(); }).join('') || '?';
}
function debounce(fn, ms){
  let t;
  return function(){
    const args = arguments, ctx = this;
    clearTimeout(t);
    t = setTimeout(function(){ fn.apply(ctx, args); }, ms);
  };
}

/* ---------- Toast ---------- */
function showToast(message, type){
  const wrap = document.getElementById('toast-wrap');
  if(!wrap) return;
  const el = document.createElement('div');
  el.className = 'toast' + (type ? ' ' + type : '');
  const ic = type === 'error' ? 'close' : (type === 'warn' ? 'bell' : 'check');
  el.innerHTML = icon(ic, 16) + '<span>' + esc(message) + '</span>';
  wrap.appendChild(el);
  setTimeout(function(){
    el.style.transition = 'opacity .3s ease, transform .3s ease';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    setTimeout(function(){ el.remove(); }, 320);
  }, 3000);
}

/* ---------- Modal ---------- */
function openModal(title, bodyHTML, buttons){
  const root = document.getElementById('modal-root');
  root.innerHTML =

      '<div class="modal" role="dialog" aria-modal="true" aria-label="' + esc(title) + '">' +

        '</div>' +
        '<div class="modal-body">' + bodyHTML + '</div>' +
        '<div class="modal-foot">' +
          (buttons || []).map(function(b, i){
            return '<button class="btn ' + (b.cls || 'btn-ghost') + '" data-mbtn="' + i + '">' + esc(b.label) + '</button>';
          }).join('') +
        '</div>' +
      '</div>' +
    '</div>';
  const backdrop = root.querySelector('[data-backdrop]');
  if(backdrop){
    backdrop.addEventListener('click', function(e){ if(e.target === backdrop) closeModal(); });
  }
  (buttons || []).forEach(function(b, i){
    const btn = root.querySelector('[data-mbtn="' + i + '"]');
    if(btn) btn.addEventListener('click', function(){ if(typeof b.onClick === 'function') b.onClick(); });
  });
  return root;
}
function closeModal(){
  const root = document.getElementById('modal-root');
  if(root) root.innerHTML = '';
}
function confirmModal(title, message, onYes, danger){
  openModal(title, '<p class="muted">' + esc(message) + '</p>', [
    {label:'Cancel', cls:'btn-ghost', onClick: closeModal},
    {label: danger === false ? 'Confirm' : 'Delete', cls: danger === false ? 'btn-primary' : 'btn-danger',

  ]);
}

/* ---------- Download ---------- */
function downloadFile(filename, content, mime){
  try{
    const blob = new Blob([content], {type: mime || 'text/plain;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
  }catch(e){ showToast('Download failed.', 'error'); }
}
function csvCell(v){
  const s = String(v === null || v === undefined ? '' : v);
  return '"' + s.replace(/"/g, '""') + '"';
}
function toCSV(headers, rows){
  const lines = [headers.map(csvCell).join(',')];
  rows.forEach(function(r){ lines.push(r.map(csvCell).join(',')); });
  return lines.join('\r\n');
}

/* ---------- Image resize ---------- */
function resizeImage(file, max){
  max = max || 400;
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onload = function(){
      const img = new Image();
      img.onload = function(){
        let w = img.width, h = img.height;
        const scale = Math.min(1, max / Math.max(w, h));
        w = Math.max(1, Math.round(w * scale));
        h = Math.max(1, Math.round(h * scale));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = h;
        cv.getContext('2d').drawImage(img, 0, 0, w, h);
        try{ resolve(cv.toDataURL('image/jpeg', 0.82)); }
        catch(e){ reject(e); }
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- Password hashing ---------- */
async function hashPassword(pw){
  const text = 'rr$' + String(pw);
  if(window.crypto && window.crypto.subtle && window.TextEncoder){
    try{
      const buf = await window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    }catch(e){ /* fall through to fallback */ }
  }
  let h1 = 0x811c9dc5, h2 = 0x1000193;
  for(let i = 0; i < text.length; i++){
    h1 ^= text.charCodeAt(i); h1 = Math.imul(h1, 16777619) >>> 0;
    h2 = Math.imul(h2 ^ text.charCodeAt(i), 2654435761) >>> 0;
  }
  return 'fb' + h1.toString(16).padStart(8,'0') + h2.toString(16).padStart(8,'0');
}

function currentUser(){
  const s = read(K.SESSION, null);
  if(!s || !s.userId) return null;
  return users().find(function(u){ return u.id === s.userId; }) || null;
}
function signOut(){
  localStorage.removeItem(K.SESSION);
  closeModal();
  state.authMode = 'signin';
  location.hash = '';

}
function passwordIssues(pw){
  const issues = [];
  if(String(pw).length < 8) issues.push('at least 8 characters');
  if(!/[A-Z]/.test(pw)) issues.push('1 uppercase letter');
  if(!/[0-9]/.test(pw)) issues.push('1 number');
  return issues;
}
function passwordScore(pw){
  let score = 0;
  if(String(pw).length >= 8) score++;
  if(/[A-Z]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;
  if(String(pw).length >= 12) score++;
  return score;
}

function showAuthError(msg){
  const el = document.getElementById('auth-err');
  if(el){ el.textContent = msg; el.classList.add('show'); }
}

function bindAuth(){
  const goSignup = document.getElementById('go-signup');
  const goSignin = document.getElementById('go-signin');
  if(goSignup) goSignup.addEventListener('click', function(){ state.authMode = 'signup'; render(); });
  if(goSignin) goSignin.addEventListener('click', function(){ state.authMode = 'signin'; render(); });

  document.querySelectorAll('[data-pass-toggle]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const input = document.getElementById(btn.dataset.passToggle);
      if(!input) return;
      const isPass = input.type === 'password';
      input.type = isPass ? 'text' : 'password';
      btn.innerHTML = icon(isPass ? 'close' : 'eye', 16);
      btn.setAttribute('aria-label', isPass ? 'Hide password' : 'Show password');
    });
  });

  const signin = document.getElementById('signin-form');
  if(signin){
    signin.addEventListener('submit', async function(e){
      e.preventDefault();
      const email = String(signin.email.value || '').trim().toLowerCase();
      const pass = String(signin.password.value || '');
      if(!email || !pass){ showAuthError('Please enter your email and password.'); return; }
      const hash = await hashPassword(pass);
      const u = users().find(function(x){
        return (String(x.email).toLowerCase() === email || String(x.name).toLowerCase() === email) && x.pass === hash;
      });
      if(!u){ showAuthError('Invalid email or password. Please try again.'); return; }
      if(u.status === 'inactive'){ showAuthError('This account has been deactivated. Contact an administrator.'); return; }
      write(K.SESSION, {userId:u.id, at:Date.now()});
      if(signin.remember.checked) localStorage.setItem('rr_last_email', u.email);
      else localStorage.removeItem('rr_last_email');
      state.authMode = 'signin';
      if(!location.hash) location.hash = '#/dashboard';
      render();
      showToast('Welcome back, ' + u.name.split(' ')[0] + '!');
    });
  }

  const signup = document.getElementById('signup-form');
  if(signup){
    const pw = document.getElementById('su-pass');
    const bar = document.getElementById('pw-bar');
    const txt = document.getElementById('pw-txt');
    pw.addEventListener('input', function(){
      const score = passwordScore(pw.value);
      const pct = Math.min(100, Math.round(score/5*100));
      bar.style.width = pct + '%';
      bar.style.background = score <= 1 ? 'var(--danger)' : score === 2 ? 'var(--warn)' : 'var(--brand)';
      const issues = passwordIssues(pw.value);
      txt.textContent = pw.value.length === 0
        ? 'Min 8 characters, 1 uppercase letter, 1 number.'
        : (issues.length ? 'Still needed: ' + issues.join(', ') + '.' : 'Strong password ✓');
      txt.style.color = issues.length ? 'var(--muted)' : 'var(--brand-600)';
    });

    signup.querySelectorAll('input[name="org"]').forEach(function(r){
      r.addEventListener('change', function(){
        const isJoin = signup.querySelector('input[name="org"]:checked').value === 'join';
        document.getElementById('org-create-box').classList.toggle('hidden', isJoin);
        document.getElementById('org-join-box').classList.toggle('hidden', !isJoin);
      });
    });

    signup.addEventListener('submit', async function(e){
      e.preventDefault();
      const name = String(signup.name.value || '').trim();
      const email = String(signup.email.value || '').trim().toLowerCase();
      const phone = String(signup.phone.value || '').trim();
      const role = signup.role.value;
      const pass = String(signup.password.value || '');
      const pass2 = String(signup.password2.value || '');
      const terms = document.getElementById('su-terms').checked;
      const orgMode = signup.querySelector('input[name="org"]:checked').value;

      if(!name || !email || !pass || !pass2){ showAuthError('Please fill in all required fields.'); return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showAuthError('Please enter a valid email address.'); return; }
      if(users().some(function(u){ return String(u.email).toLowerCase() === email; })){
        showAuthError('An account with this email already exists.'); return;
      }
      const issues = passwordIssues(pass);
      if(issues.length){ showAuthError('Password must contain ' + issues.join(', ') + '.'); return; }
      if(pass !== pass2){ showAuthError('Passwords do not match.'); return; }
      if(!terms){ showAuthError('Please accept the terms of service to continue.'); return; }

      if(orgMode === 'join'){
        const code = String(signup.inviteCode.value || '').trim();
        if(code.toUpperCase() !== String(company().inviteCode || '').toUpperCase()){
          showAuthError('Invalid invite code. Ask your administrator for the correct code.'); return;
        }
      } else {
        const centerName = String(signup.centerName.value || '').trim();
        if(centerName) saveCompany({name:centerName});
      }

      const newUser = {
        id: generateId('u'),
        name: name, email: email, phone: phone, role: role,
        pass: await hashPassword(pass),
        status: 'active',
        createdAt: new Date().toISOString()
      };
      const list = users();
      list.push(newUser);
      saveAll(K.USERS, list);
      write(K.SESSION, {userId:newUser.id, at:Date.now()});
      location.hash = '#/dashboard';
      render();
      showToast('Account created. Welcome, ' + name.split(' ')[0] + '!');
    });
  }
}

function inMonth(back){
  const d = new Date();
  d.setDate(Math.max(1, d.getDate() - back));
  return d.toISOString().slice(0,10);
}
function dayOffset(n){
  const d = new Date();
  d.setDate(d.getDate() + n);
  return d.toISOString().slice(0,10);
}

    const merged = Object.assign({}, DEFAULT_COMPANY, existing);
    if(!merged.logo) merged.logo = LOGO_DATA;
    write(K.COMPANY, merged);
  }
  if(!localStorage.getItem(K.PREFS)) write(K.PREFS, Object.assign({}, DEFAULT_PREFS));
  if(!localStorage.getItem(K.ANIMALS)) seedSampleData();
  if(!localStorage.getItem(K.LOGS)) saveAll(K.LOGS, []);
  if(!localStorage.getItem(K.RELEASES)) saveAll(K.RELEASES, []);
}

function render(){
  const root = document.getElementById('app');
  const user = currentUser();

  if(!user){
    root.innerHTML = authHTML();
    bindAuth();
    return;
  }

  const route = location.hash || '#/dashboard';
  state.route = route;

  let page = '';
  let title = 'Dashboard';

  if(route.indexOf('#/animal/') === 0){
    const id = decodeURIComponent(route.split('/')[2] || '');
    page = renderAnimalProfile(id);
    title = 'Animal Profile';
  } else if(route === '#/intake'){
    page = renderIntake(); title = 'Add Animal (Intake)';
  } else if(route === '#/animals'){
    page = renderAnimals(); title = 'Animal List';
  } else if(route === '#/carelog'){
    page = renderCareLog(); title = 'Care Log';
  } else if(route === '#/releases'){
    page = renderReleases(); title = 'Releases';
  } else if(route === '#/settings'){

  } else {
    page = renderDashboard(); title = 'Dashboard';

  root.innerHTML = shellHTML(user, route, title, page);
  afterRender();
  applyTheme();
}

function renderDashboard(){
  const user = currentUser();
  const animals = getAll(K.ANIMALS);
  const releases = getAll(K.RELEASES);
  const logs = getAll(K.LOGS);
  const p = prefs();
  const now = new Date();

  const inCare = animals.filter(function(a){ return CLOSED.indexOf(a.status) === -1; });
  const ready = animals.filter(function(a){ return a.status === 'Ready for Release'; });
  const releasedThisMonth = releases.filter(function(r){
    return r.outcome === 'Released' && isSameMonth(r.date, now);
  }).length;
  const releasedTotal = releases.filter(function(r){ return r.outcome === 'Released'; }).length;
  const closedTotal = releases.length;
  const successRate = closedTotal ? Math.round(releasedTotal / closedTotal * 100) : 0;

  const counts = {};
  STATUSES.forEach(function(s){ counts[s] = 0; });
  animals.forEach(function(a){ counts[a.status] = (counts[a.status] || 0) + 1; });
  const maxCount = Math.max(1, Math.max.apply(null, Object.keys(counts).map(function(k){ return counts[k]; })));

  const chart = STATUSES.map(function(s){
    const h = Math.round(counts[s] / maxCount * 100);
    return '<div class="bar-col">' +
      '<div class="bar-track"><div class="bar-fill" style="height:' + h + '%"></div></div>' +
      '<div class="bar-count">' + counts[s] + '</div>' +
      '<div class="bar-label">' + esc(s) + '</div>' +
    '</div>';
  }).join('');

  const recent = animals.slice().sort(function(a,b){
    return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));

  const recentHTML = recent.length ? recent.map(function(a){
    return '<a class="list-item" href="#/animal/' + encodeURIComponent(a.id) + '">' +

    '<h3>No animals yet</h3><p>Register your first rescue to get started.</p>' +
    '<a class="btn btn-primary" href="#/intake">Add Animal</a></div>';

  const today = todayISO();
  const reminders = logs.filter(function(l){ return l.nextDue && !l.done; })
    .sort(function(a,b){ return String(a.nextDue).localeCompare(String(b.nextDue)); })
    .slice(0, 6);

  const remHTML = !p.dailyReminders
    ? '<div class="alert info">' + icon('bell', 15) + '<span>Daily reminders are off. Enable them in Settings &rsaquo; Preferences.</span></div>'
    : (reminders.length ? '<div class="list">' + reminders.map(function(l){
        const a = animals.find(function(x){ return x.id === l.animalId; });
        const overdue = l.nextDue < today;
        return '<div class="list-item">' +
          '<label class="check" style="gap:8px">' +
            '<input type="checkbox" data-action="toggle-reminder" data-id="' + esc(l.id) + '" aria-label="Mark reminder done">' +
            '<span class="grow"><strong style="display:block;font-size:.82rem">' + esc(l.type) + ' — ' + esc(a ? a.commonName : l.animalId) + '</strong>' +
            '<small style="color:var(--muted);font-size:.71rem">' + esc(a ? a.id : '') + ' · ' +
              esc(l.nextDue === today ? 'Due today' : (overdue ? 'Overdue ' + formatDate(l.nextDue) : 'Due ' + formatDate(l.nextDue))) +
            '</small></span>' +
          '</label>' +
          (overdue ? '<span class="pill danger">Overdue</span>' : '<span class="pill">Due</span>') +
        '</div>';
      }).join('') + '</div>'
      : '<div class="empty" style="padding:22px 8px"><div class="em-ic">' + icon('bell', 20) + '</div>' +
        '<h3>Nothing scheduled</h3><p>Add a "next due" date to a care entry to create a reminder.</p></div>');

  return '' +

    statCard('Ready for Release', ready.length, 'Cleared for release', 'plane', 'earth') +
    statCard('Released This Month', releasedThisMonth, formatDate(todayISO()), 'check', 'info') +
    statCard('Success Rate', successRate + '%', releasedTotal + ' of ' + closedTotal + ' closed', 'heart', 'warn') +
  '</div>' +

  '<div class="two-col">' +
    '<div class="card">' +
      '<div class="card-head"><h2>' + icon('grid', 16) + ' Animals by Status</h2>' +
        '<span class="pill">' + animals.length + ' total</span></div>' +
      '<div class="bar-chart">' + chart + '</div>' +
    '</div>' +
    '<div class="card">' +
      '<div class="card-head"><h2>' + icon('bell', 16) + " Today's Reminders</h2>" +
        '<a class="btn btn-sm btn-ghost" href="#/carelog">Care Log</a></div>' +

function nextCaseId(){
  const c = company();
  const prefix = String(c.prefix || 'RR').toUpperCase();
  const nums = getAll(K.ANIMALS).map(function(a){
    const m = String(a.id).match(/(\d+)\s*$/);
    return m ? parseInt(m[1], 10) : 0;
  });
  const next = (nums.length ? Math.max.apply(null, nums) : 0) + 1;
  return prefix + '-' + String(next).padStart(4, '0');
}

function bindIntake(){
  const form = document.getElementById('intake-form');
  if(!form) return;
  state.pendingPhoto = null;

  const speciesSel = document.getElementById('intake-species');
  speciesSel.addEventListener('change', function(){
    document.getElementById('custom-species-wrap').classList.toggle('hidden', speciesSel.value !== 'Other');
  });

  const file = document.getElementById('intake-photo');
  file.addEventListener('change', async function(){
    const f = file.files && file.files[0];
    if(!f) return;
    try{
      const data = await resizeImage(f, 400);
      state.pendingPhoto = data;
      document.getElementById('photo-preview').innerHTML = '<img src="' + esc(data) + '" alt="Preview">';
    }catch(err){
      showToast('Could not read that image.', 'error');
    }
  });

  form.addEventListener('reset', function(){
    state.pendingPhoto = null;
    document.getElementById('photo-preview').innerHTML = icon('image', 22);
    document.getElementById('custom-species-wrap').classList.add('hidden');
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const speciesVal = speciesSel.value === 'Other'
      ? String(form.speciesCustom.value || '').trim()
      : speciesSel.value;
    const commonName = String(form.commonName.value || '').trim();
    const dateFound = form.dateFound.value;
    const locationFound = String(form.locationFound.value || '').trim();

    let bad = false;
    [['intake-species', speciesVal], ['intake-common', commonName],
     ['intake-date', dateFound], ['intake-location', locationFound]].forEach(function(pair){
      const el = document.getElementById(pair[0]);
      const ok = !!pair[1];
      el.classList.toggle('invalid', !ok);
      if(!ok) bad = true;
    });

    if(bad){ showToast('Please fill in all required fields.', 'error'); return; }
    if(dateFound > todayISO()){
      document.getElementById('intake-date').classList.add('invalid');
      showToast('The date found cannot be in the future.', 'error');
      return;
    }

    const c = company();
    const animals = getAll(K.ANIMALS);
    const inCare = animals.filter(function(a){ return CLOSED.indexOf(a.status) === -1; }).length;
    const capacity = Number(c.capacity) || 0;
    if(capacity > 0 && inCare >= capacity){
      confirmModal('Center at capacity',
        'You have ' + inCare + ' animals in care and a capacity of ' + capacity + '. Save this intake anyway?',
        function(){ saveIntake(); }, false);
      return;
    }
    saveIntake();

    function saveIntake(){
      const id = nextCaseId();
      const animal = {
        id: id,
        species: speciesVal,
        commonName: commonName,
        ageClass: form.ageClass.value,
        sex: form.sex.value,
        weight: Number(form.weight.value) || 0,
        dateFound: dateFound,
        locationFound: locationFound,
        foundBy: String(form.foundBy.value || '').trim(),
        contact: String(form.contact.value || '').trim(),
        reason: form.reason.value,
        conditionNotes: String(form.conditionNotes.value || '').trim(),
        status: 'Admitted',
        photo: state.pendingPhoto || '',
        createdAt: new Date().toISOString(),
        createdBy: currentUser().name
      };
      const list = getAll(K.ANIMALS);
      list.push(animal);
      saveAll(K.ANIMALS, list);

      const logs = getAll(K.LOGS);
      logs.push({
        id: generateId('cl'),
        animalId: id,
        date: todayISO(),
        type: 'Checkup',
        weight: 0,
        notes: 'Initial intake assessment.',
        staff: currentUser().name,
        nextDue: dayOffset(2),
        done: false
      });
      saveAll(K.LOGS, logs);

      showToast('Animal ' + id + ' saved successfully.');
      state.pendingPhoto = null;
      render();
    }
  });
}

   ========================================================= */
function filteredAnimals(){
  const all = getAll(K.ANIMALS);
  const q = state.list.q.trim().toLowerCase();
  let list = all.filter(function(a){
    if(state.list.status !== 'all' && a.status !== state.list.status) return false;
    if(state.list.species !== 'all' && a.species !== state.list.species) return false;
    if(q){
      const hay = (a.id + ' ' + a.commonName + ' ' + a.species + ' ' + a.locationFound + ' ' + a.foundBy).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  if(state.list.sort === 'newest') list.sort(function(a,b){ return String(b.dateFound).localeCompare(String(a.dateFound)); });
  else if(state.list.sort === 'oldest') list.sort(function(a,b){ return String(a.dateFound).localeCompare(String(b.dateFound)); });
  else if(state.list.sort === 'species') list.sort(function(a,b){ return String(a.species).localeCompare(String(b.species)) || String(a.commonName).localeCompare(String(b.commonName)); });
  return list;
}

function exportAnimalsCSV(){
  const list = filteredAnimals();
  const headers = ['Case ID','Common Name','Species','Age Class','Sex','Weight (g)','Date Found','Location Found','Found By','Contact','Reason','Status','Condition Notes'];
  const rows = list.map(function(a){

      a.locationFound, a.foundBy, a.contact, a.reason, a.status, a.conditionNotes];

  downloadFile('animals-' + todayISO() + '.csv', toCSV(headers, rows), 'text/csv;charset=utf-8');

}

function bindProfile(){
  const statusSel = document.getElementById('profile-status');
  if(statusSel){
    statusSel.addEventListener('change', function(){
      const list = getAll(K.ANIMALS);
      const idx = list.findIndex(function(a){ return a.id === statusSel.dataset.animal; });
      if(idx === -1) return;
      list[idx].status = statusSel.value;
      saveAll(K.ANIMALS, list);
      render();
      showToast('Status updated to "' + statusSel.value + '".');
    });
  }

  const form = document.getElementById('care-form');
  if(form){
    form.addEventListener('submit', function(e){
      e.preventDefault();
      const animalId = document.getElementById('profile-status').dataset.animal;
      const animal = getAll(K.ANIMALS).find(function(a){ return a.id === animalId; });
      if(!animal) return;

      const date = form.date.value;
      const type = form.type.value;
      const weight = Number(form.weight.value) || 0;
      const notes = String(form.notes.value || '').trim();
      const nextDue = form.nextDue.value || '';
      const dateEl = document.getElementById('care-date');
      const notesEl = document.getElementById('care-notes');
      const weightEl = document.getElementById('care-weight');
      const nextDueEl = document.getElementById('care-next');
      dateEl.classList.remove('invalid');
      notesEl.classList.remove('invalid');
      weightEl.classList.remove('invalid');
      nextDueEl.classList.remove('invalid');

      if(!date){
        dateEl.classList.add('invalid');
        showToast('Please choose a date.', 'error');
        return;
      }
      if(date > todayISO()){
        dateEl.classList.add('invalid');
        showToast('Care entries cannot be dated in the future.', 'error');
        return;
      }
      if(animal.dateFound && date < animal.dateFound){
        dateEl.classList.add('invalid');
        showToast('Date cannot be before the animal was admitted (' + formatDate(animal.dateFound) + ').', 'error');
        return;
      }
      if(!notes){
        notesEl.classList.add('invalid');
        showToast('Please add notes describing the care given.', 'error');
        return;
      }
      if(type === 'Weight' && weight <= 0){
        weightEl.classList.add('invalid');
        showToast('Please enter a weight for a Weight entry.', 'error');
        return;
      }
      if(nextDue && nextDue < todayISO()){
        nextDueEl.classList.add('invalid');
        showToast('Next due date cannot be in the past.', 'error');
        return;
      }

      const entry = {
        id: generateId('cl'),
        animalId: animalId,
        date: date,
        type: type,
        weight: weight,
        notes: notes,
        staff: String(form.staff.value || currentUser().name).trim(),
        nextDue: nextDue,
        done: false
      };
      const logs = getAll(K.LOGS);
      logs.push(entry);
      saveAll(K.LOGS, logs);

      if(entry.weight > 0){
        const animals = getAll(K.ANIMALS);
        const idx = animals.findIndex(function(a){ return a.id === animalId; });
        if(idx > -1){ animals[idx].weight = entry.weight; saveAll(K.ANIMALS, animals); }
      }
      render();
      showToast('Care entry saved.');
    });
  }

  const canvas = document.getElementById('weight-chart');
  if(canvas) drawWeightChart(canvas);
}

function editLogModal(logId){
  const logs = getAll(K.LOGS);
  const log = logs.find(function(l){ return l.id === logId; });
  if(!log) return;
  const logAnimal = getAll(K.ANIMALS).find(function(a){ return a.id === log.animalId; });
  const minDate = logAnimal && logAnimal.dateFound ? logAnimal.dateFound : '';
  const originalNext = log.nextDue || '';
  const typeOpts = CARE_TYPES.map(function(t){
    return '<option' + (log.type === t ? ' selected' : '') + '>' + t + '</option>';
  }).join('');

  openModal('Edit care entry',
    '<div class="row">' +
      '<div class="field"><label for="lg-date">Date</label><input id="lg-date" type="date" min="' + esc(minDate) + '" max="' + todayISO() + '" value="' + esc(log.date) + '"></div>' +
      '<div class="field"><label for="lg-type">Type</label><select id="lg-type">' + typeOpts + '</select></div>' +
    '</div>' +
    '<div class="row">' +
      '<div class="field"><label for="lg-weight">Weight (g)</label><input id="lg-weight" type="number" min="0" step="1" value="' + esc(log.weight || '') + '"></div>' +
      '<div class="field"><label for="lg-next">Next due</label><input id="lg-next" type="date" min="' + todayISO() + '" value="' + esc(originalNext) + '"></div>' +
    '</div>' +
    '<div class="field"><label for="lg-notes">Notes</label><textarea id="lg-notes">' + esc(log.notes || '') + '</textarea></div>',
    [
      {label:'Cancel', cls:'btn-ghost', onClick: closeModal},
      {label:'Save', cls:'btn-primary', onClick: function(){
        const list = getAll(K.LOGS);
        const i = list.findIndex(function(l){ return l.id === logId; });
        if(i === -1) return;
        const newDate = document.getElementById('lg-date').value;
        const newType = document.getElementById('lg-type').value;
        const newWeight = Number(document.getElementById('lg-weight').value) || 0;
        const newNext = document.getElementById('lg-next').value || '';
        if(!newDate){ showToast('Please choose a date.', 'error'); return; }
        if(newDate > todayISO()){ showToast('Date cannot be in the future.', 'error'); return; }
        if(minDate && newDate < minDate){ showToast('Date cannot be before the animal was admitted (' + formatDate(minDate) + ').', 'error'); return; }
        if(newType === 'Weight' && newWeight <= 0){ showToast('Please enter a weight for a Weight entry.', 'error'); return; }
        if(newNext && newNext < todayISO() && newNext !== originalNext){
          showToast('Next due date cannot be in the past.', 'error');
          return;
        }
        list[i].date = newDate;
        list[i].type = newType;
        list[i].weight = newWeight;
        list[i].nextDue = newNext;
        list[i].notes = document.getElementById('lg-notes').value;
        saveAll(K.LOGS, list);
        closeModal();
        render();
        showToast('Care entry updated.');
      }}
    ]);
}

function drawWeightChart(canvas){
  const animalId = canvas.dataset.animal;
  const logs = getAll(K.LOGS).filter(function(l){
    return l.animalId === animalId && Number(l.weight) > 0;
  }).sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });

  const cs = getComputedStyle(document.documentElement);
  const brand = (cs.getPropertyValue('--brand') || '').trim() || '#2e8b57';
  const lineCol = (cs.getPropertyValue('--line') || '').trim() || '#e2eae4';
  const muted = (cs.getPropertyValue('--muted') || '').trim() || '#6b7f72';

  const dpr = window.devicePixelRatio || 1;
  const W = canvas.clientWidth || 520;
  const H = 150;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.height = H + 'px';

  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if(!logs.length){
    ctx.fillStyle = muted;
    ctx.font = '12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('No weight entries recorded yet', W/2, H/2);
    return;
  }

  const pad = {l:44, r:14, t:12, b:22};
  const vals = logs.map(function(l){ return Number(l.weight); });
  let min = Math.min.apply(null, vals);
  let max = Math.max.apply(null, vals);
  if(min === max){ min = Math.max(0, min - 10); max = max + 10; }
  const iw = W - pad.l - pad.r;
  const ih = H - pad.t - pad.b;

  function px(i){ return logs.length === 1 ? pad.l + iw/2 : pad.l + (iw * i / (logs.length - 1)); }
  function py(v){ return pad.t + ih - ((v - min) / (max - min)) * ih; }

  ctx.strokeStyle = lineCol;
  ctx.lineWidth = 1;
  for(let g = 0; g <= 4; g++){
    const yy = pad.t + ih * g / 4;
    ctx.beginPath(); ctx.moveTo(pad.l, yy); ctx.lineTo(W - pad.r, yy); ctx.stroke();
  }

  ctx.fillStyle = muted;
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'right';
  for(let g = 0; g <= 4; g++){
    const v = max - (max - min) * g / 4;
    ctx.fillText(String(Math.round(v)), pad.l - 6, pad.t + ih * g / 4 + 3);
  }

  ctx.beginPath();
  logs.forEach(function(l, i){
    const x = px(i), y = py(Number(l.weight));
    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.strokeStyle = brand;
  ctx.lineWidth = 2.2;
  ctx.lineJoin = 'round';
  ctx.stroke();

  logs.forEach(function(l, i){
    ctx.beginPath();
    ctx.arc(px(i), py(Number(l.weight)), 3.2, 0, Math.PI * 2);
    ctx.fillStyle = brand;
    ctx.fill();
  });

  ctx.fillStyle = muted;
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(formatDate(logs[0].date), pad.l, H - 6);
  if(logs.length > 1){
    ctx.textAlign = 'right';
    ctx.fillText(formatDate(logs[logs.length - 1].date), W - pad.r, H - 6);
  }
}

function bindReleases(){
  const form = document.getElementById('release-form');
  if(!form) return;
  form.addEventListener('submit', function(e){
    e.preventDefault();
    const animalId = form.animalId.value;
    const outcome = form.outcome.value;
    const date = form.date.value;
    if(!animalId){ showToast('Please select an animal.', 'error'); return; }
    if(!date){ showToast('Please choose a date.', 'error'); return; }
    if(date > todayISO()){ showToast('The outcome date cannot be in the future.', 'error'); return; }

    const releases = getAll(K.RELEASES);
    releases.push({
      id: generateId('rl'),
      animalId: animalId,
      outcome: outcome,
      date: date,
      location: String(form.location.value || '').trim(),
      notes: String(form.notes.value || '').trim(),
      recordedBy: currentUser().name
    });
    saveAll(K.RELEASES, releases);

    const animals = getAll(K.ANIMALS);
    const idx = animals.findIndex(function(a){ return a.id === animalId; });
    if(idx > -1){
      animals[idx].status = outcome === 'Released' ? 'Released'
        : outcome === 'Transferred' ? 'Transferred' : 'Deceased';
      saveAll(K.ANIMALS, animals);
    }
    render();
    showToast('Outcome recorded for ' + animalId + '.');
  });
}

function bindSettings(){
  const user = currentUser();

  const form = document.getElementById('settings-form');
  if(form){
    form.addEventListener('submit', async function(e){
      e.preventDefault();
      const tab = form.dataset.tab;
      const values = formValues(form);

      if(tab === 'company'){
        saveCompany({
          name: String(values.name || '').trim() || 'RehabRangers Wildlife Center',
          orgType: values.orgType,
          permit: values.permit,
          established: values.established,
          about: values.about
        });
        showToast('Company information saved.');
      } else if(tab === 'location'){
        saveCompany({
          street: values.street, barangay: values.barangay, city: values.city,
          province: values.province, postal: values.postal, country: values.country,
          lat: values.lat, lng: values.lng, serviceArea: values.serviceArea
        });
        showToast('Location saved.');
      } else if(tab === 'contact'){
        saveCompany({
          contactPerson: values.contactPerson, position: values.position,
          phone: values.phone, altPhone: values.altPhone, hotline: values.hotline,
          email: values.email, website: values.website, facebook: values.facebook,
          instagram: values.instagram, showContact: !!values.showContact
        });
        showToast('Contact details saved.');
      } else if(tab === 'operations'){
        saveCompany({
          hours: values.hours,
          emergency24: !!values.emergency24,
          capacity: Number(values.capacity) || 0,
          prefix: String(values.prefix || 'RR').toUpperCase().replace(/[^A-Z0-9]/g, '') || 'RR',
          speciesAccepted: Array.isArray(values.speciesAccepted) ? values.speciesAccepted : [],
          vetOnCall: values.vetOnCall
        });
        showToast('Operations saved.');
      } else if(tab === 'preferences'){
        const p = savePrefs({
          theme: values.theme === 'dark' ? 'dark' : 'light',
          dateFormat: values.dateFormat,
          weightUnit: values.weightUnit,
          language: values.language || 'en',
          dailyReminders: !!values.dailyReminders
        });
        applyTheme();
        render();
        showToast('Preferences saved (' + p.theme + ' mode).');
        return;
      }
      render();
    });
  }

  const logoInput = document.getElementById('logo-file');
  if(logoInput){
    logoInput.addEventListener('change', async function(){
      const f = logoInput.files && logoInput.files[0];
      if(!f) return;
      try{
        const data = await resizeImage(f, 240);
        saveCompany({logo:data});
        render();
        showToast('Logo updated.');
      }catch(err){ showToast('Could not read that image.', 'error'); }
    });
  }

  const geoBtn = document.getElementById('geo-btn');
  if(geoBtn){
    geoBtn.addEventListener('click', function(){
      if(!navigator.geolocation){ showToast('Geolocation is not supported by this browser.', 'error'); return; }
      geoBtn.textContent = 'Locating…';
      navigator.geolocation.getCurrentPosition(function(pos){
        const lat = document.getElementById('f-lat');
        const lng = document.getElementById('f-lng');
        if(lat) lat.value = pos.coords.latitude.toFixed(6);
        if(lng) lng.value = pos.coords.longitude.toFixed(6);
        geoBtn.innerHTML = icon('mapPin', 15) + ' Use My Current Location';
        showToast('Location captured — remember to save.');
      }, function(){
        geoBtn.innerHTML = icon('mapPin', 15) + ' Use My Current Location';
        showToast('Could not get your location. Please enter it manually.', 'error');
      }, {timeout:10000});
    });
  }

  const accForm = document.getElementById('account-form');
  if(accForm){
    accForm.addEventListener('submit', function(e){
      e.preventDefault();
      const name = String(accForm.name.value || '').trim();
      const email = String(accForm.email.value || '').trim().toLowerCase();
      const phone = String(accForm.phone.value || '').trim();
      if(!name || !email){ showToast('Name and email are required.', 'error'); return; }
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ showToast('Please enter a valid email.', 'error'); return; }
      const list = users();
      if(list.some(function(u){ return u.id !== user.id && String(u.email).toLowerCase() === email; })){
        showToast('That email is already used by another account.', 'error'); return;
      }
      const idx = list.findIndex(function(u){ return u.id === user.id; });
      list[idx].name = name;
      list[idx].email = email;
      list[idx].phone = phone;
      saveAll(K.USERS, list);
      render();
      showToast('Profile updated.');
    });
  }

  const pwForm = document.getElementById('password-form');
  if(pwForm){
    pwForm.addEventListener('submit', async function(e){
      e.preventDefault();
      const cur = String(pwForm.current.value || '');
      const np = String(pwForm.newpass.value || '');
      const np2 = String(pwForm.newpass2.value || '');
      const hash = await hashPassword(cur);
      if(hash !== user.pass){ showToast('Current password is incorrect.', 'error'); return; }
      const issues = passwordIssues(np);
      if(issues.length){ showToast('New password needs ' + issues.join(', ') + '.', 'error'); return; }
      if(np !== np2){ showToast('New passwords do not match.', 'error'); return; }
      const list = users();
      const idx = list.findIndex(function(u){ return u.id === user.id; });
      list[idx].pass = await hashPassword(np);
      saveAll(K.USERS, list);
      pwForm.reset();
      showToast('Password updated successfully.');
    });
  }

  const importFile = document.getElementById('import-file');
  if(importFile){
    importFile.addEventListener('change', function(){
      const f = importFile.files && importFile.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = function(){
        try{
          const data = JSON.parse(String(reader.result));
          applyImport(data);
        }catch(err){ showToast('Invalid backup file.', 'error'); }
      };
      reader.onerror = function(){ showToast('Could not read the file.', 'error'); };
      reader.readAsText(f);
    });
  }
}

function formValues(form){
  const out = {};
  Array.from(form.elements).forEach(function(el){
    if(!el.name) return;
    if(el.type === 'checkbox'){
      const same = form.querySelectorAll('[name="' + el.name + '"]');
      if(same.length > 1){
        out[el.name] = out[el.name] || [];
        if(el.checked) out[el.name].push(el.value);
      } else {
        out[el.name] = el.checked;
      }
    } else if(el.type === 'radio'){
      if(el.checked) out[el.name] = el.value;
    } else if(el.tagName === 'SELECT' && el.multiple){
      out[el.name] = Array.from(el.selectedOptions).map(function(o){ return o.value; });
    } else {
      out[el.name] = el.value;
    }
  });
  return out;
}

function editUserModal(id){
  const list = users();
  const u = list.find(function(x){ return x.id === id; });
  if(!u) return;
  openModal('Edit user — ' + u.name,
    '<div class="field"><label for="eu-name">Full name</label><input id="eu-name" type="text" value="' + esc(u.name) + '"></div>' +
    '<div class="field"><label for="eu-email">Email</label><input id="eu-email" type="email" value="' + esc(u.email) + '"></div>' +
    '<div class="field"><label for="eu-phone">Phone</label><input id="eu-phone" type="text" value="' + esc(u.phone || '') + '"></div>' +
    '<div class="row">' +
      '<div class="field"><label for="eu-role">Role</label><select id="eu-role">' +
        ROLES.map(function(r){ return '<option' + (u.role === r ? ' selected' : '') + '>' + r + '</option>'; }).join('') +
      '</select></div>' +
      '<div class="field"><label for="eu-status">Status</label><select id="eu-status">' +
        ['active','inactive'].map(function(s){ return '<option' + ((u.status || 'active') === s ? ' selected' : '') + '>' + s + '</option>'; }).join('') +
      '</select></div>' +
    '</div>',
    [
      {label:'Cancel', cls:'btn-ghost', onClick: closeModal},
      {label:'Save', cls:'btn-primary', onClick: function(){
        const arr = users();
        const i = arr.findIndex(function(x){ return x.id === id; });
        if(i === -1) return;
        arr[i].name = document.getElementById('eu-name').value.trim() || arr[i].name;
        arr[i].email = document.getElementById('eu-email').value.trim().toLowerCase() || arr[i].email;
        arr[i].phone = document.getElementById('eu-phone').value.trim();
        arr[i].role = document.getElementById('eu-role').value;
        arr[i].status = document.getElementById('eu-status').value;
        saveAll(K.USERS, arr);
        closeModal();
        render();
        showToast('User updated.');
      }}
    ]);
}

function deleteUser(id){
  const me = currentUser();
  if(me.id === id){ showToast('You cannot remove your own account.', 'error'); return; }
  const u = users().find(function(x){ return x.id === id; });
  if(!u) return;
  confirmModal('Remove user', 'Remove ' + u.name + ' (' + u.email + ') from this center?', function(){
    saveAll(K.USERS, users().filter(function(x){ return x.id !== id; }));
    render();
    showToast('User removed.');
  });
}

function exportAllJSON(){
  const payload = {
    app:'RehabRangers',
    exportedAt: new Date().toISOString(),
    users: getAll(K.USERS),
    company: company(),
    animals: getAll(K.ANIMALS),
    careLogs: getAll(K.LOGS),
    releases: getAll(K.RELEASES),
    preferences: prefs()
  };
  downloadFile('rehabrangers-backup-' + todayISO() + '.json', JSON.stringify(payload, null, 2), 'application/json');
  savePrefs({lastBackup: new Date().toISOString()});
  render();
  showToast('Backup exported.');
}

function applyImport(data){
  if(!data || typeof data !== 'object'){ showToast('Invalid backup file.', 'error'); return; }
  confirmModal('Import backup',
    'This will replace all current data with the contents of the backup file. Continue?',
    function(){
      if(Array.isArray(data.users)) saveAll(K.USERS, data.users);
      if(data.company && typeof data.company === 'object') write(K.COMPANY, data.company);
      if(Array.isArray(data.animals)) saveAll(K.ANIMALS, data.animals);
      if(Array.isArray(data.careLogs)) saveAll(K.LOGS, data.careLogs);
      if(Array.isArray(data.releases)) saveAll(K.RELEASES, data.releases);
      if(data.preferences && typeof data.preferences === 'object') write(K.PREFS, data.preferences);
      applyTheme();
      render();
      showToast('Backup imported successfully.');
    }, false);
}

function clearAllData(){
  confirmModal('Clear all data',
    'This permanently deletes all animals, care logs, releases, users and settings from this browser. Are you absolutely sure?',
    function(){
      Object.keys(K).forEach(function(k){ localStorage.removeItem(K[k]); });
      localStorage.removeItem('rr_last_email');
      location.hash = '';
      state.authMode = 'signin';
      initData().then(function(){ render(); showToast('All data cleared and demo data restored.'); });
    });
}

/* =========================================================
   17. GLOBAL EVENT HANDLERS
   ========================================================= */
document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;
  const id = el.dataset.id;

  switch(action){
    case 'close-modal':
      closeModal();
      break;
    case 'signout':
      signOut();
      break;
    case 'toggle-theme': {
      const p = prefs();
      savePrefs({theme: p.theme === 'dark' ? 'light' : 'dark'});
      applyTheme();
      render();
      break;
    }
    case 'toggle-sidebar': {
      const sb = document.getElementById('sidebar');
      if(sb) sb.classList.toggle('open');
      break;
    }
    case 'toggle-user-menu': {
      const dd = document.getElementById('user-dropdown');
      if(dd) dd.hidden = !dd.hidden;
      break;
    }
    case 'go-account':
      state.settingsTab = 'account';
      break;
    case 'toggle-reminder': {
      const logs = getAll(K.LOGS);
      const i = logs.findIndex(function(l){ return l.id === id; });
      if(i > -1){
        logs[i].done = true;
        saveAll(K.LOGS, logs);
        render();
        showToast('Reminder marked as done.');
      }
      break;
    }
    case 'goto-page':
      state.list.page = Number(el.dataset.page) || 1;
      render();
      break;
    case 'edit-animal':
      editAnimalModal(id);
      break;
    case 'delete-animal':
      deleteAnimal(id);
      break;
    case 'edit-log':
      editLogModal(id);
      break;
    case 'delete-log':
      deleteLog(id);
      break;
    case 'export-animals':
      exportAnimalsCSV();
      break;
    case 'print-animals':
      printAnimals();
      break;
    case 'release-report':
      printHTML('Release & Outcome Report', releaseReportHTML());
      break;
    case 'export-releases':
      exportReleasesCSV();
      break;
    case 'print-releases': {
      const animals = getAll(K.ANIMALS);
      const rows = getAll(K.RELEASES).map(function(r){
        const a = animals.find(function(x){ return x.id === r.animalId; });
        return '<tr><td>' + esc(r.animalId) + '</td><td>' + esc(a ? a.commonName : '—') + '</td>' +
          '<td>' + esc(r.outcome) + '</td><td>' + esc(formatDate(r.date)) + '</td>' +
          '<td>' + esc(r.location || '—') + '</td></tr>';
      }).join('');
      printHTML('Release History',
        '<table><thead><tr><th>Case ID</th><th>Animal</th><th>Outcome</th><th>Date</th><th>Location</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>');
      break;
    }
    case 'settings-tab':
      state.settingsTab = el.dataset.tab;
      render();
      break;
    case 'edit-user':
      editUserModal(id);
      break;
    case 'delete-user':
      deleteUser(id);
      break;
    case 'gen-invite': {
      const code = 'RR-' + Math.random().toString(36).slice(2, 8).toUpperCase();
      saveCompany({inviteCode: code});
      render();
      showToast('New invite code generated: ' + code);
      break;
    }
    case 'copy-invite': {
      const input = document.getElementById('invite-code');
      const code = input ? input.value : '';
      if(!code) return;
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(code).then(function(){ showToast('Invite code copied.'); })
          .catch(function(){ showToast('Copy failed — select the code manually.', 'error'); });
      } else {
        input.select();
        try{ document.execCommand('copy'); showToast('Invite code copied.'); }
        catch(err){ showToast('Copy failed — select the code manually.', 'error'); }
      }
      break;
    }
    case 'export-json':
      exportAllJSON();
      break;
    case 'import-json': {
      const file = document.getElementById('import-file');
      if(file) file.click();
      break;
    }
    case 'clear-all':
      clearAllData();
      break;
  }
});

  if(dd && !dd.hidden && !e.target.closest('.user-menu')) dd.hidden = true;

async function boot(){
  await initData();
  applyTheme();
  if(!location.hash && currentUser()) location.hash = '#/dashboard';

}

boot();
